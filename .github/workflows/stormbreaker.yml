name: Build Stormbreaker Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libelf-dev clang lld llvm git zip unshield

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 1. Load Defconfig bawaan Stormbreaker
          make O=out ARCH=arm64 vendor/lime_defconfig

          # 2. Matikan fitur upgrade firmware Focaltech agar tidak memanggil fw_sample.i
          scripts/config --file out/.config --disable CONFIG_TOUCHSCREEN_FOCALTECH_UPGRADE_FIRMWARE
          scripts/config --file out/.config --disable CONFIG_TOUCHSCREEN_FOCALTECH_FIRMWARE_UPGRADE

          # 3. Jalankan Kompilasi Murni
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

      - name: Upload Kernel Output
        uses: actions/upload-artifact@v4
        with:
          name: Stormbreaker-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
